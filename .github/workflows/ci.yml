# Intégration continue / Continuous integration
# Rejoue les portes de qualité automatisables sur chaque PR :
# build de production, svelte-check, tests unitaires.
# Les parcours d'interface sont vérifiés à part, dans un vrai Chrome piloté
# par Claude Code ; voir e2e/README.md.
# Runs the automatable quality gates on every PR: production build,
# svelte-check, unit tests. Interface journeys are verified separately, in a
# real Chrome driven by Claude Code; see e2e/README.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule les exécutions obsolètes sur une même branche.
# Cancels superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node est requis même sous Bun : vite et Playwright s'exécutent dessus.
      # Node is required even under Bun: vite and Playwright run on it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Garder en phase avec le champ packageManager de package.json.
      # Keep in sync with the packageManager field in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Produit aussi .svelte-kit/tsconfig.json, requis par svelte-check,
      # et valide l'adapter Cloudflare.
      # Also produces .svelte-kit/tsconfig.json, required by svelte-check,
      # and validates the Cloudflare adapter.
      - name: Build
        run: bun run build

      - name: Type & a11y check
        run: bun run check

      - name: Unit tests
        run: bun run test
